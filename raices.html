<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Root Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
/* Layout: the map is the original plain-text diagram, set in a mono font on a canvas you drag and zoom.
   Colour lives only in the type. */
:root{
  --paper:#f7f5f0;
  --ink:#1a1a1a;
  --ink-2:#555c66;
  --ink-3:#8a8f98;
  --line:#b8b3a7;
  --gr:#1f5fa8;
  --la:#a5482b;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-mono);-webkit-font-smoothing:antialiased}

#view{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#view.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#map{margin:0;padding:48px;font:300 16px/1.55 var(--f-mono);color:var(--ink);white-space:pre;user-select:none;-webkit-user-select:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}

/* Every character outside plain ASCII sits in a cell exactly one column wide (.6em = one JetBrains Mono column), so a glyph borrowed
   from another font can never push the columns. Tree lines are drawn, not typed: they always meet. */
#map .c,#map .b{display:inline-block;width:.6em;text-align:center;vertical-align:top}
#map .b{position:relative;height:1.55em}
#map .b::before{content:"";position:absolute;top:50%;left:var(--hl,0);right:var(--hr,0);border-top:1px solid var(--line);display:var(--h,block)}
#map .b::after{content:"";position:absolute;left:50%;top:var(--vt,0);bottom:var(--vb,0);border-left:1px solid var(--line);display:var(--v,block)}
#map .v{--h:none}
#map .hz{--v:none}
#map .tl{--hl:50%;--vt:50%}
#map .tr{--hr:50%;--vt:50%}
#map .bl{--hl:50%;--vb:50%}
#map .br{--hr:50%;--vb:50%}
#map .lt{--hl:50%}
#map .rt{--hr:50%}
#map .td{--vt:50%}
#map .tu{--vb:50%}
#map .ar{--vb:55%}
#map .ar::before{left:50%;right:auto;top:auto;bottom:22%;width:0;margin-left:-4px;border-top:6px solid var(--line);
  border-left:4px solid transparent;border-right:4px solid transparent}

#map .ln{color:var(--line)}
#map .h{font-weight:600;color:var(--ink)}
#map .gr{color:var(--gr);font-weight:400}
#map .la{color:var(--la);font-weight:400}
#map .es{color:var(--ink);font-weight:600}
#map .pie{color:var(--ink-2);font-style:italic;font-weight:400}

.top{position:fixed;left:0;right:0;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(var(--paper) 65%,transparent);
  font-size:13px;pointer-events:none}
.top > *{pointer-events:auto}
.top a{color:var(--ink-2);text-decoration:none}
.top a:hover{color:var(--gr)}
.top .title{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px}
.legend .pie{color:var(--ink-2);font-style:italic}
.legend .gr{color:var(--gr)}
.legend .la{color:var(--la)}
.legend .es{font-weight:600}

.controls{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;gap:4px;
  background:var(--paper)}
.controls button{min-width:44px;height:44px;padding:0 10px;border:0;background:none;color:var(--ink-2);
  font:400 15px var(--f-mono);cursor:pointer}
.controls button.big{font-size:22px}
.controls button:hover{color:var(--gr)}
</style>
</head>
<body>

<div id="view"><div id="world"><pre id="map"></pre></div></div>

<header class="top">
  <a href="./">← Griego básico</a>
  <span class="title">Root map</span>
  <span class="legend"><span class="pie">*Proto-Indo-European</span><span class="gr">Greek</span><span class="la">Latin</span><span class="es">modern words</span></span>
</header>
<div class="controls">
  <button class="big" id="out" aria-label="Zoom out">−</button>
  <button class="big" id="in" aria-label="Zoom in">+</button>
  <button id="all">see all</button>
</div>

<!-- The map as plain text (generated on a character grid so every column lines up); the script only colours words. -->
<script type="text/plain" id="source">
======================================================================================================================================================================================================================================================================
                                                                                                      INDO-EUROPEAN ETYMOLOGICAL, PHONETIC AND MORPHOLOGICAL MAP
======================================================================================================================================================================================================================================================================

                                                                ============================================================================
                                                                 TRUNK 1: CELESTIAL AND LUMINOUS SPHERE
                                                                 PIE root: *dyeu- / *deiw- ("to shine", "sunlight", "daytime sky")
                                                                ============================================================================
                                                                                                      │
                                    ┌─────────────────────────────────────────────────────────────────┴──────────────────────────────────────────────────────────────────┐
                                    ▼                                                                                                                                    ▼
                   [ HELLENIC BRANCH / GREEK ]                                                                                                          [ ITALIC BRANCH / LATIN ]
                   Sound rule:                                                                                                                          Sound rules:
                   • Stressed *dy- before a vowel became an affricate: *dy- > /dz/ > /zd/ (Ζ)                                                           • Loss of the initial dental stop: *dy- > /j/ (spelled I)
                   • Unstressed *di- kept the dental stop: *di- > /di/ (Δ)                                                                              • Full grade with thematic suffix: *deiw-ós > *deus
                                    │                                                                                                                                    │
         ┌──────────────────────────┴──────────────────────────┐                                                              ┌──────────────────────────────────────────┴──────────────────────────────────────────┐
         ▼                                                     ▼                                                              ▼                                                                                     ▼
       (Nominative form)                                     (Oblique forms)                                                (Noun: god)                                                                           (Noun: day)
       *Dyḗws                                                *Diw-ós (genitive)                                             *deywós ("the heavenly one")                                                          *dyēus ("daylight")
         │                                                     │                                                              │                                                                                     │
         ▼                                                     ▼                                                              ▼                                                                                     ▼
       ΖΕΎΣ / Ζεύς                                           ΔΙΌΣ / Διός                                                     deus                                                                                  dies
       (Zeús, 8th c. BC)                                     ("of Zeus", classical)                                           │                                                                                     │
         │                                                     │                                                              │                                                                                     │
         │                                                     ▼                                    ┌─────────────────────────┼─────────────────────────┐                                 ┌─────────────────────────┼─────────────────────────┐
         │                                                   (Analogical levelling)                 ▼                         ▼                         ▼                                 ▼                         ▼                         ▼
         │                                                   Nominative rebuilt                   Dios (Sp.)                Dio (It.)                 English                           Día (Sp.)                 Dì (It.)                  English
         │                                                   from the oblique stem:                 │                         │                         │                                 │                         │                         │
         │                                                   Δι- + ending -ας                       ▼                         ▼                         ▼                                 ▼                         ▼                         ▼
         │                                                     │                                  • deidad                  • deificare               • deity                           • diario                  • giorno (< diurnus)      • diary
         │                                                     ▼                                  • divino                  • divinità                • divine                          • diurno                  • meridiano               • diurnal
         │                                                   ΔΊΑΣ / Δίας                          • adivinar                • addio                   • divination                      • mediodía                • quotidiano              • journal (Fr. jour)
         │                                                   (Días, modern Greek)                                                                                                                                                           • journey
         │                                                     │
         └──────────────────────────┬──────────────────────────┘
                                    │
                     PIE formula: *Dyḗws ph₂tḗr ("Shining Sky Father")
                                    │
                  ┌─────────────────┴───────────────────────┐
                  ▼                                         ▼
                In Greek:                                 In Latin:
                Ζεῦ πάτερ (Zeû páter)                     *Dieus-pater > *Diespiter
                • ritual vocative                         • regular loss of initial *d-: *Ieu-pater
                • Homeric invocation                      • assimilation and doubling: Iuppiter (gen. Iovis)
                                                            │
                                                            ▼
                                                          Later forms:
                                                          • Júpiter (Sp., /j/ > /x/) · Jupiter (Eng.)
                                                          • jueves (Sp., < dies Iovis, "Jupiter's day")
                                                          • giovedì (It.) · jeudi (Fr.)
                                                          • jovial (Eng., < Iovis: born under Jupiter)


======================================================================================================================================================================================================================================================================


                                                                 ============================================================================
                                                                  TRUNK 2: RITUAL AND SACRED SPHERE
                                                                  PIE root: *dʰeh₁s- / *dʰh₁s- ("to establish", "the sacred / instituted")
                                                                 ============================================================================
                                                                                                       │
                                    ┌──────────────────────────────────────────────────────────────────┴───────────────────────────────────────────────────────────────────┐
                                    ▼                                                                                                                                      ▼
                   [ HELLENIC BRANCH / GREEK ]                                                                                                            [ ITALIC BRANCH / LATIN ]
                   Sound rule (Grassmann's law / devoicing):                                                                                              Italic sound rule:
                   • The voiced aspirated dental becomes a voiceless aspirated stop:                                                                      • Initial voiced aspirates become voiceless
                     initial *dʰ- > /tʰ/ (written with the letter theta: Θ)                                                                                 labiodental fricatives: initial *dʰ- > /f/ (F)
                                    │                                                                                                                                      │
                                    ▼                                                                                                                                      ▼
                          *dʰh₁s-ós > *tʰeh₁-os                                                                                                           *dʰh₁s- / *dʰeh₁s- > *fas- / *fes-
                                    │                                                                                                                                      │
                                    ▼                                                                                                                                      ▼
                               ΘΕΌΣ / θεός                                                                             ┌───────────────────────────────────────────────────┼───────────────────────────────────────────────────┐
                          ("god", generic noun)                                                                        ▼                                                   ▼                                                   ▼
                                    │                                                                                *dʰh₁s-no-m                                         *dʰeh₁s-to-s                                        *dʰeh₁s-ye-
         ┌──────────────────────────┴──────────────────────────┐                                                     (sacred place)                                      (sacred rite)                                       (holy days)
         ▼                                                     ▼                                                       │                                                   │                                                   │
       (Vocative case)                                       (Greek-derived words)                                     ▼                                                   ▼                                                   ▼
       θεός + thematic ending -e                             in English · Spanish:                                   fanum                                               festus                                              feriae
         │                                                     │                                                       │                                                   │                                                   │
         ▼                                                     ▼                                          ┌────────────┴────────────┐                         ┌────────────┴────────────┐                         ┌────────────┴────────────┐
       ΘΕΈ / θεέ                                             • Θεολογία  > theology · teología            ▼                         ▼                         ▼                         ▼                         ▼                         ▼
       ("O God!", vocative                                   • Ἄθεος     > atheist · ateo               profano · profane         fanático · fanatic        fiesta · feast            festivo · festive         feria · fair              feira (Pt.)
        used to invoke)                                      • Ἔνθεος    > enthusiasm · entusiasmo      (< pro-fanum,             (< fanaticus, inspired    (< festa,                 (< festivus,              (< feriae,                (weekday, e.g.
                                                             • Θεοκρατία > theocracy · teocracia         "outside the temple")     by the fanum;             "days of rejoicing")      "public celebration";     "time without work")      terça-feira:
                                                             • Ἀποθέωσις > apotheosis · apoteosis                                  Eng. fan)                                           Eng. festival)                                      "third day off")
                                                             • Θεόδωρος  > Theodore · Teodoro / Doroteo

======================================================================================================================================================================================================================================================================

    HOW TO READ THE DIAGRAM

    1. Alphabet correspondences
       Ζ (zeta):  the affricated outcome of stressed *dy- in Greek (Ζεύς).
       Δ (delta): keeps the dental stop in intervocalic or unstressed position (Διός, Δίας).
       Θ (theta): the regular Greek outcome of the aspirate *dʰ- (θεός, θεέ).
       F (Latin): the Latin counterpart of the same aspirate *dʰ- (fanum, festus, feriae).

    2. Common noun vs proper name
       θεός (theós) is a common noun: a category, "a god", any deity.
       Ζεύς (Zeús) / Δίας (Días) is the proper name of the supreme Indo-European god of the daytime sky.

======================================================================================================================================================================================================================================================================
</script>

<script>
/* ——— Colour the words, keep every character ——— */
const L = "(?<![\\p{L}\\p{M}])", R = "(?![\\p{L}\\p{M}])";
const RULES = [
  ["ln",  "[─│┌┐└┘├┤┬┴┼▼]+|={3,}"],
  ["h",   "TRUNK \\d:[^\\n]*|INDO-EUROPEAN ETYMOLOGICAL[^\\n]*|HOW TO READ THE DIAGRAM"],
  ["gr",  "\\[ HELLENIC BRANCH / GREEK \\]|[\\u0370-\\u03FF\\u1F00-\\u1FFF]+(?: [\\u0370-\\u03FF\\u1F00-\\u1FFF]+)*"],
  ["la",  "\\[ ITALIC BRANCH / LATIN \\]|" + L + "(?:dies Iovis|Iuppiter|Iovis|deus|dies|pro-fanum|fanum|festus|feriae|fanaticus|festivus|festa|diurnus)" + R],
  ["es",  L + "(?:Dios|Dio|Día|Dì|deidad|divino|adivinar|deificare|divinità|addio|deity|divine|divination|diario|diurno|mediodía|giorno"
        + "|meridiano|quotidiano|diary|diurnal|journal|journey|jour|Júpiter|Jupiter|jueves|giovedì|jeudi|jovial|theology|teología|atheist|ateo"
        + "|enthusiasm|entusiasmo|theocracy|teocracia|apotheosis|apoteosis|Theodore|Teodoro|Doroteo|profano|profane|fanático|fanatic|fan"
        + "|fiesta|feast|festivo|festive|festival|feria|fair|terça-feira|feira)" + R],
  ["pie", "\\*[^\\s(),\"]+(?: ph₂tḗr)?"]
];
const re = new RegExp(RULES.map(([, p]) => `(${p})`).join("|"), "gu");
const BOX = { "│": "v", "─": "hz", "┌": "tl", "┐": "tr", "└": "bl", "┘": "br", "├": "lt", "┤": "rt", "┬": "td", "┴": "tu", "┼": "x", "▼": "ar" };
const graphemes = t => Intl.Segmenter ? [...new Intl.Segmenter("es", { granularity: "grapheme" }).segment(t)].map(g => g.segment) : [...t];
const esc = t => graphemes(t).map(g =>
  BOX[g] ? `<i class="b ${BOX[g]}"></i>`
  : g === "&" ? "&amp;" : g === "<" ? "&lt;" : g === ">" ? "&gt;"
  : /^[\x20-\x7e\n]$/.test(g) ? g
  : `<span class="c">${g}</span>`).join("");
const text = document.getElementById("source").textContent.replace(/^\n/, "").replace(/\s+$/, "");
let html = "", last = 0;
for (const m of text.matchAll(re)) {
  const k = RULES[m.slice(1).findIndex(g => g !== undefined)][0];
  html += esc(text.slice(last, m.index)) + `<span class="${k}">${esc(m[0])}</span>`;
  last = m.index + m[0].length;
}
document.getElementById("map").innerHTML = html + esc(text.slice(last));

/* ——— Pan and zoom ——— */
const view = document.getElementById("view"), world = document.getElementById("world"), map = document.getElementById("map");
let s = 1, tx = 0, ty = 0;
const MIN = 0.1, MAX = 3;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
function animate(fn) {
  world.classList.add("anim"); fn(); apply();
  clearTimeout(animate.t); animate.t = setTimeout(() => world.classList.remove("anim"), 460);
}
function zoomAt(px, py, f) {
  const ns = Math.min(MAX, Math.max(MIN, s * f));
  tx = px - (px - tx) * ns / s; ty = py - (py - ty) * ns / s; s = ns;
}
function fitAll() {
  const top = 56, bottom = 60, w = map.offsetWidth, h = map.offsetHeight;
  s = Math.min(innerWidth / w, (innerHeight - top - bottom) / h, 1.4);
  tx = (innerWidth - w * s) / 2; ty = top + (innerHeight - top - bottom - h * s) / 2;
}
function start() {
  // wide screens: the map's full width, as large as fits; phones: readable size from the top left
  const w = map.offsetWidth;
  s = Math.min(1.4, innerWidth / w);
  if (s < 0.6) s = 0.75;
  tx = s * w <= innerWidth ? (innerWidth - w * s) / 2 : 0;
  ty = 40;
}

document.getElementById("in").onclick = () => animate(() => zoomAt(innerWidth / 2, innerHeight / 2, 1.5));
document.getElementById("out").onclick = () => animate(() => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.5));
document.getElementById("all").onclick = () => animate(fitAll);
addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") animate(() => zoomAt(innerWidth / 2, innerHeight / 2, 1.5));
  else if (e.key === "-") animate(() => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.5));
  else if (e.key === "0") animate(fitAll);
});

view.addEventListener("wheel", e => {
  e.preventDefault();
  world.classList.remove("anim");
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01)); // trackpad pinch, or ctrl + wheel
  else { tx -= e.deltaX; ty -= e.deltaY; }
  apply();
}, { passive: false });
view.addEventListener("dblclick", e => animate(() => zoomAt(e.clientX, e.clientY, 1.6)));

const pts = new Map();
let pinch = null;
view.addEventListener("pointerdown", e => {
  view.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  world.classList.remove("anim"); view.classList.add("dragging");
  pinch = null;
});
view.addEventListener("pointermove", e => {
  const p = pts.get(e.pointerId);
  if (!p) return;
  if (pts.size === 1) { tx += e.clientX - p.x; ty += e.clientY - p.y; }
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch) { tx += mx - pinch.mx; ty += my - pinch.my; zoomAt(mx, my, d / pinch.d); }
    pinch = { d, mx, my };
  }
  apply();
});
const lift = e => { pts.delete(e.pointerId); pinch = null; if (!pts.size) view.classList.remove("dragging"); };
view.addEventListener("pointerup", lift);
view.addEventListener("pointercancel", lift);

start(); apply();
document.fonts?.ready.then(() => { start(); apply(); });
</script>
</body>
</html>
